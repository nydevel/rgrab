[package]
name = "server"
version.workspace = true
edition.workspace = true
description = "rgrab — lightweight observability backend with Loki-compatible API"
license = "MIT"
homepage = "https://github.com/nydevel/rgrab"
repository = "https://github.com/nydevel/rgrab"

[package.metadata.deb]
name = "rgrab"
maintainer = "nydevel"
copyright = "2024 nydevel"
depends = "$auto"
section = "net"
priority = "optional"
extended-description = """Lightweight observability backend for logs and distributed traces.
Accepts OpenTelemetry (OTLP) traces, provides Loki-compatible query API,
Uses embedded RocksDB for storage."""
assets = [
    ["target/release/server", "usr/bin/rgrab", "755"],
    ["target/release/rgrab-tui", "usr/bin/rgrab-tui", "755"],
    ["../../packaging/config/rgrab.toml", "etc/rgrab/rgrab.toml", "644"],
]
conf-files = ["/etc/rgrab/rgrab.toml"]
systemd-units = { unit-name = "rgrab", unit-scripts = "../../packaging/systemd", enable = false }
maintainer-scripts = "../../packaging/scripts"

[package.metadata.generate-rpm]
name = "rgrab"
license = "MIT"
summary = "Lightweight observability backend for logs and distributed traces"
assets = [
    { source = "target/release/server", dest = "/usr/bin/rgrab", mode = "755" },
    { source = "target/release/rgrab-tui", dest = "/usr/bin/rgrab-tui", mode = "755" },
    { source = "packaging/config/rgrab.toml", dest = "/etc/rgrab/rgrab.toml", mode = "644", config = true },
    { source = "packaging/systemd/rgrab.service", dest = "/usr/lib/systemd/system/rgrab.service", mode = "644" },
]
post_install_script = "packaging/scripts/postinst"
pre_uninstall_script = "packaging/scripts/prerm"

[dependencies]
common = { path = "../common" }
storage = { path = "../storage" }
web = { path = "../web" }
collector = { path = "../collector" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
docker-collector = { path = "../docker-collector" }
