[package]
name = "server"
version.workspace = true
edition.workspace = true
description = "rgrab — lightweight observability backend with Loki-compatible API"
license = "MIT"
homepage = "https://github.com/nydevel/rgrab"
repository = "https://github.com/nydevel/rgrab"

[package.metadata.deb]
name = "rgrab"
maintainer = "nydevel"
copyright = "2024 nydevel"
depends = "$auto"
section = "net"
priority = "optional"
extended-description = """Lightweight observability backend for logs and distributed traces.
Accepts OpenTelemetry (OTLP) traces, provides Loki-compatible query API,
Uses embedded RocksDB for storage."""
assets = [
    ["target/release/server", "usr/bin/rgrab", "755"],
    ["../../packaging/config/rgrab.toml", "etc/rgrab/rgrab.toml", "644"],
]
conf-files = ["/etc/rgrab/rgrab.toml"]
systemd-units = { unit-name = "rgrab", unit-scripts = "../../packaging/systemd", enable = false }
maintainer-scripts = "../../packaging/scripts"

[dependencies]
common = { path = "../common" }
storage = { path = "../storage" }
web = { path = "../web" }
collector = { path = "../collector" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
