name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build:
        runs-on: self-hosted

        container:
            image: ghcr.io/${{ github.repository }}/builder:latest
            volumes:
                - /opt/rgrab-cache/cargo:/cache/cargo
                - /opt/rgrab-cache/target:/cache/target

        env:
            CARGO_HOME: /cache/cargo
            CARGO_TARGET_DIR: /cache/target

        steps:
            - uses: actions/checkout@v4

            - name: Build release binaries
              run: cargo build --release

            - name: Build deb package
              run: cargo deb -p server --no-build --target-dir /cache/target

            - name: Get version from tag
              id: version
              run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  name: rgrab ${{ steps.version.outputs.version }}
                  generate_release_notes: true
                  files: |
                      /cache/target/debian/*.deb
                      /cache/target/release/server
                      /cache/target/release/rgrab-tui
